[project]
name = "fds"
version = "0.0.1"
description = "Fusion Data Service — scalable, FAIR-compliant access to fusion experiment metadata and data"
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "UK Atomic Energy Authority" }]
maintainers = [{ name = "Nathan Cummings", email = "nathan.cummings@ukaea.uk" }]
keywords = ["fusion", "FAIR", "DCAT", "PROV-O", "IMAS", "metadata", "catalogue"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
dependencies = [
    "alembic>=1.20.0",
    "cachetools>=7.2.0",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.141.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.14.0",
    "cryptography>=50.0.1",
    "sqlmodel>=0.0.42",
    "structlog>=26.1.0",
    "opentelemetry-api>=1.44.0",
]

[project.urls]
Homepage = "https://ukaea.github.io/fds/"
Repository = "https://github.com/ukaea/fds"
Issues = "https://github.com/ukaea/fds/issues"


[project.optional-dependencies]
s3 = [
    "boto3>=1.43.98",
]
gcs = [
    "google-auth>=2.58.0",
    "requests>=2.34.2",
]
azure = [
    "azure-storage-blob>=12.30.2",
    "azure-identity>=1.25.3",
]
otel = [
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.65b0",
    "opentelemetry-sdk>=1.44.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.1",
    "httpx>=0.27.2",
    "ruff>=0.16.7",
    "pyright>=1.1.414",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["-m", "not end_to_end"]
markers = [
    "end_to_end: drives a running FDS over HTTP; start the stack, then 'pytest -m end_to_end'",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# I: import sorting. ARG: unused arguments, which nothing else reports.
extend-select = ["I", "ARG"]
# B008 flags function calls in argument defaults. FastAPI's `Depends()` is
# exactly that by design, so the rule cannot apply here.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# pytest resolves fixtures by parameter name, so a fixture requested purely for
# its side effect cannot be renamed to satisfy ARG. DTZ: fixtures build naive
# datetimes on purpose; the naive-versus-aware round trip is a known open bug and
# the tests should keep exercising the model as it is.
"tests/**" = ["ARG", "DTZ"]

[tool.pyright]
venvPath = "."
venv = ".venv"
exclude = [".venv"]
typeCheckingMode = "standard"
