[project]
name = "fds"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.17.2",
    "cachetools>=6.2.4",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.121.3",
    "pydantic-settings>=2.12.0",
    "pyjwt>=2.10.1",
    "cryptography>=44.0.0",
    "sqlmodel>=0.0.27",
]


[project.optional-dependencies]
s3 = [
    "boto3>=1.42.25",
]
gcs = [
    "google-auth>=2.37.0",
    "requests>=2.31.0",
]
azure = [
    "azure-storage-blob>=12.19.0",
    "azure-identity>=1.15.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
]
