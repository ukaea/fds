[project]
name = "fds"
version = "0.1.0"
description = "Fusion Data Service — scalable, FAIR-compliant access to fusion experiment metadata and data"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.17.2",
    "cachetools>=6.2.4",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.121.3",
    "pydantic-settings>=2.12.0",
    "pyjwt>=2.10.1",
    "cryptography>=44.0.0",
    "sqlmodel>=0.0.27",
    "structlog>=26.1.0",
    "opentelemetry-api>=1.44.0",
]


[project.optional-dependencies]
s3 = [
    "boto3>=1.42.25",
]
gcs = [
    "google-auth>=2.37.0",
    "requests>=2.31.0",
]
azure = [
    "azure-storage-blob>=12.19.0",
    "azure-identity>=1.15.0",
]
otel = [
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.65b0",
    "opentelemetry-sdk>=1.44.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
    "httpx>=0.27.2",
    "ruff>=0.9.2",
    "pyright>=1.1.414",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["-m", "not integration"]
markers = [
    "integration: requires live docker-compose stack — run with 'pytest -m integration'",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# I: import sorting. ARG: unused arguments, which nothing else reports.
extend-select = ["I", "ARG"]

[tool.ruff.lint.per-file-ignores]
# pytest resolves fixtures by parameter name, so a fixture requested purely for
# its side effect cannot be renamed to satisfy ARG.
"tests/**" = ["ARG"]

[tool.pyright]
venvPath = "."
venv = ".venv"
exclude = [".venv", "demo"]
typeCheckingMode = "standard"
