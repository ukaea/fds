[project]
name = "fds"
version = "0.1.1"
description = "Fusion Data Service — scalable, FAIR-compliant access to fusion experiment metadata and data"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "UK Atomic Energy Authority" }]
maintainers = [{ name = "Nathan Cummings", email = "nathan.cummings@ukaea.uk" }]
keywords = ["fusion", "FAIR", "DCAT", "PROV-O", "IMAS", "metadata", "catalogue"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
dependencies = [
    "alembic>=1.20.1",
    "psycopg[binary]>=3.3.6",
    "cachetools>=7.2.8",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.162.0",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "cryptography>=50.0.2",
    "sqlmodel>=0.0.48",
    "structlog>=26.1.0",
    "opentelemetry-api>=1.45.2",
    "pyld>=3.3.0",
]

[project.urls]
Homepage = "https://ukaea.github.io/fds/"
Repository = "https://github.com/ukaea/fds"
Issues = "https://github.com/ukaea/fds/issues"


[project.optional-dependencies]
s3 = [
    "boto3>=1.43.123",
]
gcs = [
    "google-auth>=2.62.0",
    "requests>=2.34.2",
]
azure = [
    "azure-storage-blob>=12.31.1",
    "azure-identity>=1.27.0",
]
otel = [
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.65b0",
    "opentelemetry-sdk>=1.44.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-mock>=3.17.0",
    "httpx>=0.27.2",
    "ruff>=0.17.3",
    "pyright>=1.1.414",
    "testcontainers[postgres]>=4.15.0",
    "moto[s3,sts]>=5.2.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["-m", "not end_to_end"]
cache_dir = ".cache/pytest"
markers = [
    "end_to_end: drives a running FDS over HTTP; start the stack, then 'pytest -m end_to_end'",
]

[tool.ruff]
line-length = 88
cache-dir = ".cache/ruff"
# Migrations are Alembic's output, kept exactly as generated. force-exclude
# keeps the hooks off them too: they pass file names, which ruff otherwise checks.
extend-exclude = ["fds/migrations/versions"]
force-exclude = true

[tool.ruff.lint]
# I: import sorting. ARG: unused arguments, which nothing else reports.
extend-select = ["I", "ARG"]
# B008 flags function calls in argument defaults. FastAPI's `Depends()` is
# exactly that by design, so the rule cannot apply here.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# pytest resolves fixtures by parameter name, so a fixture requested purely for
# its side effect cannot be renamed to satisfy ARG. DTZ: fixtures build naive
# datetimes on purpose; the naive-versus-aware round trip is a known open bug and
# the tests should keep exercising the model as it is.
"tests/**" = ["ARG", "DTZ"]

[tool.pyright]
# The oldest Python FDS supports, rather than the venv's interpreter, so a newer
# standard-library API is reported.
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
exclude = ["**/node_modules", "**/__pycache__", "**/.*", "fds/migrations/versions"]
typeCheckingMode = "standard"

[tool.alembic]
script_location = "%(here)s/fds/migrations"
prepend_sys_path = ["."]
