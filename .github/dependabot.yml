version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]
      # Security updates ignore open-pull-requests-limit and arrive one PR per
      # advisory unless grouped separately; the version-update group above does
      # not apply to them.
      python-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/ui"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      ui-minor-and-patch:
        update-types: ["minor", "patch"]
      ui-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      # Every codeql-action step in a workflow has to be the same version: the
      # action refuses to run otherwise ("Loaded a configuration file for
      # version X, but running version Y"). Bumping init and analyze in separate
      # pull requests leaves each of them mismatched, so they move together.
      # Listed first because a dependency joins the first group it matches.
      codeql-action:
        patterns: ["github/codeql-action*"]
      actions-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/ui"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
