version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]
      # Security updates ignore open-pull-requests-limit and arrive one PR per
      # advisory unless grouped separately; the version-update group above does
      # not apply to them.
      python-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/demo/ui"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      ui-minor-and-patch:
        update-types: ["minor", "patch"]
      ui-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2

  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/demo/ui"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
