name: PR title

# The squash commit takes the PR title, and release-please reads those commits to
# choose the next version, so the title is what has to follow Conventional Commits.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  # A required check has to report in the merge queue too. A queue entry has no
  # title to read, so the job is skipped there, which counts as passing.
  merge_group:

permissions:
  pull-requests: read

jobs:
  title:
    name: Conventional Commit title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
