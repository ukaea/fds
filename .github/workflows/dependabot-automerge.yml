name: Dependabot auto-merge

# Routine dependency bumps merge themselves once CI is green. A human still
# looks at every major, which is where a bump can mean real work.
#
# The release app approves the PR and arms auto-merge. Once CI passes the PR
# joins the merge queue, which tests it again on top of the latest main, so
# nothing lands unverified. The built-in token will not do: GitHub does not let
# it add a PR to a merge queue.

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Read what Dependabot changed
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # A run Dependabot triggers can read only Dependabot secrets, so the
      # release app's credentials are stored there as well.
      - name: Mint the release app's token for patch and minor bumps
        id: app
        if: steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Approve and arm auto-merge
        if: steps.app.outcome == 'success'
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.app.outputs.token }}

      - name: Leave majors for a human
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        run: echo "::notice::Major version bump; not auto-merging. ${{ steps.meta.outputs.dependency-names }}"
