name: Dependabot auto-merge

# Routine dependency bumps merge themselves once CI is green. A human still
# looks at every major, which is where a bump can mean real work.
#
# Arming auto-merge is all this does. Branch protection still requires the CI
# checks to pass and the branch to be current, so nothing lands unverified.

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Read what Dependabot changed
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Arm auto-merge for patch and minor bumps
        if: steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Leave majors for a human
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        run: echo "::notice::Major version bump; not auto-merging. ${{ steps.meta.outputs.dependency-names }}"
