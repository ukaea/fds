name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, type-check and test
    runs-on: ubuntu-latest
    # The tests run against a real PostgreSQL: FDS has no other backend, and a
    # substitute would only prove the substitute works.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fds
          POSTGRES_PASSWORD: fds
          POSTGRES_DB: fds_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fds"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FDS_TEST_DB_URL: postgresql+psycopg://fds:fds@localhost:5432/fds_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # Reads .python-version, so the pinned interpreter is the one CI uses.
      - name: Install dependencies
        run: uv sync --all-extras --frozen

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type-check
        run: uv run pyright

      - name: Test
        run: uv run --all-extras pytest

      # Fails when the models have changed without a matching migration. The
      # schema itself is built by the migrations in the test run above, so this
      # only has to compare.
      - name: Check the models match the migrations
        run: uv run alembic check
        env:
          FDS_DB_URL: postgresql+psycopg://fds:fds@localhost:5432/fds_test

      # Every migration must be reversible: rolling back a release that migrated
      # means downgrading before deploying the older image.
      - name: Downgrade and re-apply the migrations
        run: uv run alembic downgrade base && uv run alembic upgrade head
        env:
          FDS_DB_URL: postgresql+psycopg://fds:fds@localhost:5432/fds_test

  ui:
    name: UI lint and type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Neither of these ran anywhere until now, which is how the lint script
      # came to be broken for a whole major version of TypeScript without
      # anyone finding out.
      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

  end-to-end:
    name: End-to-end tests
    runs-on: ubuntu-latest
    # Black box: the suite is pointed at a running FDS and asserts only over
    # HTTP, so the same tests serve as a deployment's smoke test.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --all-extras --frozen

      # The stack trusts this key, and the suite signs its tokens with it, so no
      # identity provider has to run.
      - name: Generate the signing key the stack trusts
        run: uv run scripts/mint-token.py init --out-dir dev

      - name: Start the stack
        run: docker compose up -d --build

      - name: Wait for FDS to become ready
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health > /dev/null; then
              echo "FDS is up"
              exit 0
            fi
            sleep 5
          done
          echo "FDS did not become ready in time"
          docker compose logs --no-color
          exit 1

      - name: Run end-to-end tests
        run: uv run --all-extras pytest -m end_to_end

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
