name: CI

# No run on push to main: the merge queue has already tested what lands there.
on:
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, type-check and test
    runs-on: ubuntu-latest
    # The tests run against a real PostgreSQL: FDS has no other backend, and a
    # substitute would only prove the substitute works.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fds
          POSTGRES_PASSWORD: fds
          POSTGRES_DB: fds_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fds"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FDS_TEST_DB_URL: postgresql+psycopg://fds:fds@localhost:5432/fds_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # Reads .python-version, so the pinned interpreter is the one CI uses.
      - name: Install dependencies
        run: uv sync --all-extras --locked

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type-check
        run: uv run pyright

      - name: Test
        run: uv run --all-extras pytest

      # Fails when the models have changed without a matching migration. The
      # schema itself is built by the migrations in the test run above, so this
      # only has to compare.
      - name: Check the models match the migrations
        run: uv run alembic check
        env:
          FDS_DB_URL: postgresql+psycopg://fds:fds@localhost:5432/fds_test

      # Every migration must be reversible: rolling back a release that migrated
      # means downgrading before deploying the older image.
      - name: Downgrade and re-apply the migrations
        run: uv run alembic downgrade base && uv run alembic upgrade head
        env:
          FDS_DB_URL: postgresql+psycopg://fds:fds@localhost:5432/fds_test

  oldest-python:
    name: Test on the oldest supported Python
    runs-on: ubuntu-latest
    # The job above runs the 3.14 that production uses. FDS also supports every
    # Python NumPy does, and only running the tests on the oldest shows that
    # nothing newer has crept in.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fds
          POSTGRES_PASSWORD: fds
          POSTGRES_DB: fds_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fds"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FDS_TEST_DB_URL: postgresql+psycopg://fds:fds@localhost:5432/fds_test
      # Overrides .python-version for every uv command in the job.
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: py312

      - name: Install dependencies
        run: uv sync --all-extras --locked

      - name: Test
        run: uv run --all-extras pytest

  ui:
    name: UI lint and type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # Dependabot tracks advisories; npm's audit summary would only repeat them.
      - name: Install dependencies
        run: npm ci --no-audit

      # Neither of these ran anywhere until now, which is how the lint script
      # came to be broken for a whole major version of TypeScript without
      # anyone finding out.
      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

  end-to-end:
    name: End-to-end tests
    runs-on: ubuntu-latest
    # Black box: the suite is pointed at a running FDS and asserts only over
    # HTTP, so the same tests serve as a deployment's smoke test.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --all-extras --locked

      # The stack trusts this key, and the suite signs its tokens with it, so no
      # identity provider has to run.
      - name: Generate the signing key the stack trusts
        run: uv run scripts/mint-token.py init --out-dir dev

      - name: Start the stack
        run: docker compose up -d --build

      # The UI as well as the API: identifiers name the service address, which
      # the UI serves, so the suite dereferences them through it.
      - name: Wait for the stack to become ready
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health > /dev/null \
              && curl -fsS http://localhost:3000/ > /dev/null; then
              echo "The stack is up"
              exit 0
            fi
            sleep 5
          done
          echo "The stack did not become ready in time"
          docker compose logs --no-color
          exit 1

      - name: Run end-to-end tests
        run: uv run --all-extras pytest -m end_to_end

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
