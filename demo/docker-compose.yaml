services:
  fds:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - FDS_TRUSTED_IDPS=[{"issuer":"http://localhost:8080/realms/fds","allowed_scopes":["*"]}]
      - FDS_OIDC_AUDIENCE=fds-client
      - FDS_STS_ENDPOINT_URL=http://localhost:9000
      - FDS_STS_ROLE_ARN=arn:aws:iam::123456789012:role/fds-role # Placeholder, will be configured in minio
      - AWS_ACCESS_KEY_ID=fds-sa
      - AWS_SECRET_ACCESS_KEY=fds-sa-secret
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - ./init_db.py:/fds/demo/init_db.py
    # Override CMD for demo to initialize DB without migrations
    command: sh -c "python demo/init_db.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    extra_hosts:
      - "localhost:host-gateway"
    depends_on:
      - idp
      - minio

  idp:
    image: quay.io/keycloak/keycloak:23.0.0
    ports:
      - "8080:8080"
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    volumes:
      - ./keycloak-realm.json:/opt/keycloak/data/import/realm.json
    command: start-dev --import-realm

  minio:
    image: quay.io/minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password
    volumes:
      - ./minio-data:/data
    command: server /data --console-address ":9001"

  minio-setup:
    image: quay.io/minio/mc:latest
    depends_on:
      - minio
    volumes:
      - ./minio-setup.sh:/minio-setup.sh
    entrypoint: /bin/sh
    command: /minio-setup.sh

  data-generator:
    image: ghcr.io/astral-sh/uv:python3.14-bookworm-slim
    depends_on:
      - minio
      - minio-setup
    environment:
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
      - AWS_DEFAULT_REGION=us-east-1
      - MINIO_URL=http://localhost:9000
    volumes:
      - ./generate_data.py:/app/generate_data.py
      - ./source_data:/source_data:ro
    network_mode: host
    command: uv run /app/generate_data.py

  frontend:
    build:
      context: ./ui
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://fds:8000/api
      - AUTH_TRUST_HOST=true
      - AUTH_URL=http://localhost:3000
      - AUTH_SECRET=demo-secret-change-me
      - AUTH_KEYCLOAK_ID=fds-client
      - AUTH_KEYCLOAK_SECRET=fds-client-secret
      # Issuer MUST match what Keycloak puts in its tokens (the external/browser URL)
      - AUTH_KEYCLOAK_ISSUER=http://localhost:8080/realms/fds
      # Internal URLs for server-to-server communication within Docker network
      - AUTH_KEYCLOAK_INTERNAL_URL=http://idp:8080/realms/fds
      - AUTH_KEYCLOAK_METADATA_URL=http://idp:8080/realms/fds/.well-known/openid-configuration
      - AUTH_KEYCLOAK_PUBLIC_URL=http://localhost:8080/realms/fds/protocol/openid-connect/auth
    depends_on:
      - fds
      - idp
