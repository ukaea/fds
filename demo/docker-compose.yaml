services:
  fds:
    logging:
      # A file driver, not podman's journald default, which accepts these
      # options and silently ignores them. json-file is the name both podman
      # and docker understand.
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - FDS_TRUSTED_IDPS=[{"issuer":"http://localhost:8080/realms/fds","allowed_scopes":["*"]}]
      - FDS_OIDC_AUDIENCE=fds-client
      - FDS_STORAGE_PROVIDERS=[{"type":"s3","endpoint_url":"http://localhost:9000","region":"us-east-1","sts_endpoint_url":"http://minio:9000","sts_role_arn":"arn:aws:iam::123456789012:role/fds-role"}]
      - AWS_ACCESS_KEY_ID=fds-sa
      - AWS_SECRET_ACCESS_KEY=fds-sa-secret
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - ./init_db.py:/fds/demo/init_db.py
    # Override CMD for demo to initialize DB without migrations
    command: sh -c "python demo/init_db.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    extra_hosts:
      - "localhost:host-gateway"
    depends_on:
      - idp
      - minio
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")'"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  idp:
    logging:
      # A file driver, not podman's journald default, which accepts these
      # options and silently ignores them. json-file is the name both podman
      # and docker understand.
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    image: quay.io/keycloak/keycloak:23.0.0
    ports:
      - "8080:8080"
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    volumes:
      - ./keycloak-realm.json:/opt/keycloak/data/import/realm.json
    command: start-dev --import-realm

  minio:
    logging:
      # A file driver, not podman's journald default, which accepts these
      # options and silently ignores them. json-file is the name both podman
      # and docker understand.
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    image: quay.io/minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password
      - MINIO_API_CORS_ALLOW_ORIGIN=*
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"

  minio-setup:
    logging:
      # A file driver, not podman's journald default, which accepts these
      # options and silently ignores them. json-file is the name both podman
      # and docker understand.
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    image: quay.io/minio/mc:latest
    depends_on:
      - minio
    volumes:
      - ./minio-setup.sh:/minio-setup.sh
    entrypoint: /bin/sh
    command: /minio-setup.sh

  data-generator:
    logging:
      # A file driver, not podman's journald default, which accepts these
      # options and silently ignores them. json-file is the name both podman
      # and docker understand.
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    image: ghcr.io/astral-sh/uv:python3.14-bookworm-slim
    depends_on:
      minio:
        condition: service_started
      minio-setup:
        condition: service_completed_successfully
    environment:
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
      - AWS_DEFAULT_REGION=us-east-1
      - MINIO_URL=http://localhost:9000
    volumes:
      - ./generate_data.py:/app/generate_data.py
    network_mode: host
    command: sh -c '[ "${FDS_DEMO_SEED:-1}" = 0 ] || uv run /app/generate_data.py'

  metadata-seeder:
    logging:
      # A file driver, not podman's journald default, which accepts these
      # options and silently ignores them. json-file is the name both podman
      # and docker understand.
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    # Runs on every `up`, once FDS is healthy, to populate the demo catalog so the
    # documented examples work against a live instance out of the box.
    image: ghcr.io/astral-sh/uv:python3.14-bookworm-slim
    depends_on:
      fds:
        condition: service_healthy
    environment:
      - FDS_API_URL=http://localhost:8000/api/v1
      - KEYCLOAK_URL=http://localhost:8080/realms/fds/protocol/openid-connect/token
    volumes:
      - ./seed_metadata.py:/app/seed_metadata.py
    network_mode: host
    command: sh -c '[ "${FDS_DEMO_SEED:-1}" = 0 ] || uv run /app/seed_metadata.py'

  frontend:
    logging:
      # A file driver, not podman's journald default, which accepts these
      # options and silently ignores them. json-file is the name both podman
      # and docker understand.
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    build:
      context: ./ui
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://fds:8000/api
      - AUTH_TRUST_HOST=true
      - AUTH_URL=http://localhost:3000
      - AUTH_SECRET=demo-secret-change-me
      - AUTH_KEYCLOAK_ID=fds-client
      - AUTH_KEYCLOAK_SECRET=fds-client-secret
      # Issuer MUST match what Keycloak puts in its tokens (the external/browser URL)
      - AUTH_KEYCLOAK_ISSUER=http://localhost:8080/realms/fds
      # Internal URLs for server-to-server communication within Docker network
      - AUTH_KEYCLOAK_INTERNAL_URL=http://idp:8080/realms/fds
      - AUTH_KEYCLOAK_METADATA_URL=http://idp:8080/realms/fds/.well-known/openid-configuration
      - AUTH_KEYCLOAK_PUBLIC_URL=http://localhost:8080/realms/fds/protocol/openid-connect/auth
    depends_on:
      - fds
      - idp

volumes:
  minio-data:
